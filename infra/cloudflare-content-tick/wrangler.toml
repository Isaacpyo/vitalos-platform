# Vitalos content tick (ADR-042): calls the website's tick route every minute. Workers free plan.
# No secrets here. Set these once, from this folder, with wrangler (it prompts for each value):
#
#   npx wrangler secret put TICK_URL      # https://www.vitalos.co.uk/api/content/cron/tick
#   npx wrangler secret put CRON_SECRET   # same value as the website's CRON_SECRET (Vercel production)
#
# Deploy: npx wrangler deploy   (docs/content/README.md, "Scheduler")
name = "vitalos-content-tick"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["* * * * *"]
