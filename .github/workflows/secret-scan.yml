name: Secret scan
# Pull requests only: every change reaches main and stage-1 through one. The CI `audit` job also runs
# the tracked-file secret scan (`pnpm check:security`) on every CI run.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned: .gitleaks.toml (ADR-025 allowlist) was validated against this version.
          GITLEAKS_VERSION: 8.28.0
