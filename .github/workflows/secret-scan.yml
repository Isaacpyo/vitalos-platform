name: Secret scan
# Every pull request (secrets can be in any file, drafts included), and main for direct pushes.
# Pushes to other branches are covered by their pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The gitleaks binary, not gitleaks-action: the action needs a paid licence for repositories
      # owned by an organisation (this repo moved to vitalos-technologies on 26 Oct 2026). Same
      # approach as the askbridge repo.
      # Pinned: .gitleaks.toml (ADR-025 allowlist) was validated against this version.
      - name: gitleaks 8.28.0
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # Only the history being tested (the PR merge or main), not every branch the checkout
          # fetched. Config: .gitleaks.toml.
          ./gitleaks git --log-opts=HEAD --redact --no-banner -v .
