name: Secret scan
on: [pull_request, push]
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned: .gitleaks.toml (ADR-025 allowlist) was validated against this version.
          GITLEAKS_VERSION: 8.28.0
