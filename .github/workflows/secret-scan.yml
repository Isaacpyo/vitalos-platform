name: Secret scan
# Every pull request (secrets can be in any file, drafts included), and main for direct pushes.
# Pushes to other branches are covered by their pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned: .gitleaks.toml (ADR-025 allowlist) was validated against this version.
          GITLEAKS_VERSION: 8.28.0
