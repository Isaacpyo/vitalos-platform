name: CI
on:
  pull_request:
  push:
    branches: [main, stage-1]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Canonical origin used by builds. The e2e server overrides it with its own local origin.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:boundaries
      - run: pnpm check:cms-types
      - run: pnpm build
      - run: pnpm storybook:build

  # Browser suites against a production build (ADR-021). The Playwright config builds and starts
  # apps/web itself with fixture content, the in-memory enquiry backend and Cloudflare's dummy
  # Turnstile keys; nothing here needs a secret or a remote service.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (builds and starts apps/web)
        run: pnpm test:e2e
      - name: Accessibility (axe, WCAG 2.2 AA)
        run: pnpm test:a11y
        env: { E2E_SKIP_BUILD: "1" }
        if: ${{ !cancelled() }}
      - name: JavaScript budgets
        run: pnpm test:perf
        env: { E2E_SKIP_BUILD: "1" }
        if: ${{ !cancelled() }}
      - name: Client bundle secret scan
        run: pnpm check:bundle-secrets
        if: ${{ !cancelled() }}
      - name: Integration tests (no Docker, so database-backed tests skip)
        run: pnpm test:integration
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # axe against every story in the static Storybook build.
  storybook-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm storybook:build
      - run: pnpm test:storybook-a11y
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: storybook-a11y-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # pgTAP tests against a LOCAL Supabase stack in Docker. Never links to or pushes to a remote
  # project: there is no access token, project ref or database password in this job.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 } # pinned: "latest" hits GitHub API rate limits
      - name: Start local Supabase (database and API only)
        run: supabase start -x studio,mailpit,logflare,vector,edge-runtime,imgproxy,storage-api,realtime,postgres-meta,supavisor
      - name: pgTAP
        run: supabase test db
      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup
