name: CI
# Cost rules: AGENTS.md "CI cost". `quality` runs first and decides what else a pull request needs
# (tooling/scripts/ci-changes.mjs): Turborepo --affected on pull requests, the full suite on main.
# Every pull request starts this workflow, because `quality` is a required check and a check that
# never reports blocks the merge; for Markdown, docs/ (except docs/strategy, which a unit test
# reads), the Super Admin and the other workflows it runs only the secret scan, audit and format
# check, and every other job skips. Pushes to main skip the workflow for those files. Browser suites
# and pgTAP skip draft pull requests.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/strategy/**"
      - "!superadmin/**"
      - "!.github/workflows/audit.yml"
      - "!.github/workflows/backup.yml"
      - "!.github/workflows/codeql.yml"
      - "!.github/workflows/secret-scan.yml"
      - "!.github/workflows/superadmin.yml"
      - "!.github/workflows/superadmin-deploy.yml"
      - "!.github/dependabot.yml"
      - "!.github/CODEOWNERS"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Canonical origin used by builds. The e2e server overrides it with its own local origin.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
jobs:
  # Fail fast: change detection, the G8 secret scan and `pnpm audit --audit-level high`
  # (exceptions: docs/security/dependency-advisories.md), format, lint, typecheck and boundaries.
  # Every other job waits for it.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.changes.outputs.full }}
      unit: ${{ steps.changes.outputs.unit }}
      web: ${{ steps.changes.outputs.web }}
      storybook: ${{ steps.changes.outputs.storybook }}
      database: ${{ steps.changes.outputs.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # A pull request checks out its merge commit; its first parent is the base branch tip.
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Decide which jobs this change needs
        id: changes
        run: node tooling/scripts/ci-changes.mjs ${{ github.event_name != 'pull_request' && '--full' || '' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-quality-${{ github.sha }}
          restore-keys: turbo-quality-
      - run: pnpm check:security
      - run: pnpm format:check
      - name: Lint and typecheck (affected packages on pull requests)
        if: steps.changes.outputs.static == 'true'
        run: pnpm turbo run lint typecheck ${{ steps.changes.outputs.full != 'true' && '--affected' || '' }}
        env: { TURBO_SCM_BASE: "HEAD^1" }
      - if: steps.changes.outputs.static == 'true'
        run: pnpm check:boundaries
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .turbo/cache
          key: turbo-quality-${{ github.sha }}

  unit:
    needs: quality
    if: needs.quality.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-unit-${{ github.sha }}
          restore-keys: turbo-unit-
      - name: Unit tests and build (affected packages on pull requests)
        run: pnpm turbo run test build ${{ needs.quality.outputs.full != 'true' && '--affected' || '' }}
        env: { TURBO_SCM_BASE: "HEAD^1" }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .turbo/cache
          key: turbo-unit-${{ github.sha }}

  # Browser suites against a production build (ADR-021). The Playwright config builds and starts
  # apps/web itself with fixture content, the in-memory enquiry backend and Cloudflare's dummy
  # Turnstile keys; nothing here needs a secret or a remote service.
  e2e:
    needs: quality
    if: needs.quality.outputs.web == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (builds and starts apps/web)
        run: pnpm test:e2e
      - name: Accessibility (axe, WCAG 2.2 AA)
        run: pnpm test:a11y
        env: { E2E_SKIP_BUILD: "1" }
        if: ${{ !cancelled() }}
      - name: JavaScript budgets
        run: pnpm test:perf
        env: { E2E_SKIP_BUILD: "1" }
        if: ${{ !cancelled() }}
      - name: Client bundle secret scan
        run: pnpm check:bundle-secrets
        if: ${{ !cancelled() }}
      - name: Integration tests (no Docker, so database-backed tests skip)
        run: pnpm test:integration
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # The `sparse` fixture set sits below every publication gate. Gated routes are decided at build
  # time and a second build would overwrite `.next`, so it is its own job: it builds and serves
  # apps/web with VITALOS_FIXTURE_SET=sparse and runs only the *.sparse.spec.ts files (ADR-021).
  e2e-sparse:
    needs: quality
    if: needs.quality.outputs.web == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Sparse-content end-to-end (builds and starts apps/web with the sparse set)
        run: pnpm test:e2e:sparse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-sparse
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # The draft editorial content source (ADR-025): repo-authored content pending owner approval.
  # Gated routes and page content are decided at build time, so it is its own build like the sparse
  # job: the Playwright config builds and serves apps/web with VITALOS_CONTENT_SOURCE=draft, the
  # memory enquiry backend and the dummy Turnstile keys. Fixture-specific specs skip themselves
  # (tests/support/content-source.ts). No secrets, no remote services.
  e2e-draft:
    needs: quality
    if: needs.quality.outputs.web == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_CONTENT_SOURCE: draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Draft-content end-to-end (builds and starts apps/web with the draft source)
        run: pnpm test:e2e
      - name: Accessibility on the draft templates (axe, WCAG 2.2 AA)
        run: pnpm test:a11y
        env: { E2E_SKIP_BUILD: "1" }
        if: ${{ !cancelled() }}
      - name: Client bundle secret scan
        run: pnpm check:bundle-secrets
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-draft
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # Visual regression (ADR-021 decision 7). NON-GATING: continue-on-error, and it must never be
  # added to the required checks until the owner approves the Figma templates. Baselines are
  # specific to this runner's Chromium and fonts, so the job is self-baselining: with no committed
  # `linux-ci` baselines it records them and uploads `visual-baselines-for-adoption`; with them it
  # compares and uploads `visual-diff-report` on any difference. See tests/visual/README.md.
  visual:
    needs: quality
    if: needs.quality.outputs.web == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      VISUAL_BASELINE_SET: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Decide whether CI baselines exist
        id: baselines
        run: |
          if [ -d tests/visual/__screenshots__/linux-ci ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Visual regression (compare against committed CI baselines)
        if: steps.baselines.outputs.present == 'true'
        run: pnpm test:visual
      - name: Visual regression (no CI baselines yet, record them)
        if: steps.baselines.outputs.present == 'false'
        run: pnpm test:visual --update-snapshots=all
      - name: Baselines for adoption
        if: ${{ !cancelled() && steps.baselines.outputs.present == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-for-adoption
          path: tests/visual/__screenshots__/linux-ci
          if-no-files-found: warn
          retention-days: 7
      - name: Diff report
        if: ${{ !cancelled() && steps.baselines.outputs.present == 'true' && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # axe against every story in the static Storybook build.
  storybook-a11y:
    needs: quality
    if: needs.quality.outputs.storybook == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm storybook:build
      - run: pnpm test:storybook-a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: storybook-a11y-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # pgTAP tests against a LOCAL Supabase stack in Docker. Never links to or pushes to a remote
  # project: there is no access token, project ref or database password in this job.
  database:
    needs: quality
    if: needs.quality.outputs.database == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 2.120.0 } # pinned: "latest" hits GitHub API rate limits
      - name: Start local Supabase (database and API only)
        run: supabase start -x studio,mailpit,logflare,vector,edge-runtime,imgproxy,storage-api,realtime,postgres-meta,supavisor
      - name: pgTAP
        run: supabase test db
      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup
