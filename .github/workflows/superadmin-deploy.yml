name: Super Admin deploy
run-name: Super Admin deploy ${{ github.event.workflow_run.head_sha || github.sha }}
# Production deploy of superadmin/ to Azure Container Apps (consumption plan, UK South) at zero
# monthly cost: public image on ghcr.io (pulled without credentials), free-tier PostgreSQL (Supabase by
# default, or Neon), Cloudflare free DNS, Azure managed TLS.
# Two triggers. (1) Automatic: when the "Super Admin" CI workflow completes successfully for a push to
# main that changed superadmin/ (not its docs or markdown) or this file, the exact commit CI tested
# (workflow_run.head_sha, never the moving branch tip) is deployed. A failed, cancelled or skipped CI
# run never deploys; destructive migrations stop the run (guard in "plan"); the database is dumped
# and encrypted before migrations run; the live /healthz/ and image are checked afterwards.
# (2) Manual: workflow_dispatch with confirm=DEPLOY, for redeploys, rollbacks and reviewed destructive
# migrations. Manual runs skip the changed-files and migration guards.
# Deploys queue (group superadmin-deploy, never cancelled mid-migration). The deploy job uses the
# "production" environment (it resolves to the Vercel-created "Production"; no required reviewer on
# this plan) holding AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC, no stored Azure keys),
# SUPERADMIN_DATABASE_URL (the Super Admin's own Supabase session pooler or Neon pooled string, never the
# website's) and, optionally, CLOUDFLARE_API_TOKEN and SENTRY_DSN, plus the optional mail and enquiry
# secrets and variables listed in superadmin/docs/email-setup.md section 9. The pre-migration backup job
# dispatches backup.yml (the "backup" environment, encrypted dump) and waits for it to succeed; this
# workflow never creates or uploads a dump itself, because the repository is public.
# See superadmin/docs/DEPLOY.md.
on:
  workflow_run:
    workflows: ["Super Admin"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy the selected ref to https://admin.vitalos.co.uk
        required: true
      smoke_test:
        description: >-
          Run the live browser smoke test (first deploy only: it signs in as the bootstrap admin,
          creates and archives "Smoke test" records, and is skipped once a real authenticator exists)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Only runs that can deploy join the queue; an ignored workflow_run (failed CI, say) gets its own
  # group so it can never replace a queued real deploy.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    && 'superadmin-deploy' || format('superadmin-deploy-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (guards, resources and expected cost)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - id: decide
        name: Decide the commit to deploy
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual deploy of $DISPATCH_SHA: changed-files and migration guards skipped."
            { echo "deploy=true"; echo "sha=$DISPATCH_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head_sha"; exit 1; }
          # A skipped or cancelled job inside a "successful" CI run must not deploy either.
          conclusions="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs" --paginate --jq '.jobs[].conclusion')"
          total="$(grep -c . <<< "$conclusions" || true)"
          not_green="$(grep -vc '^success$' <<< "$conclusions" || true)"
          if [ "$total" -eq 0 ] || [ "$not_green" -ne 0 ]; then
            echo "::notice::Super Admin CI run $CI_RUN_ID has $not_green of $total jobs not green; not deploying."
            { echo "deploy=false"; echo "sha=$CI_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth=2 origin "$CI_SHA"
          changed="$(git diff --name-only "$CI_SHA^" "$CI_SHA")"
          echo "Files in $CI_SHA:"; echo "$changed"
          # Same scope as the Super Admin CI paths filter (its docs and markdown start nothing).
          relevant="$(grep -E '^(superadmin/|\.github/workflows/superadmin-deploy\.yml$)' <<< "$changed" |
            grep -vE '^superadmin/docs/|\.md$' || true)"
          if [ -z "$relevant" ]; then
            echo "::notice::No Super Admin runtime files changed in $CI_SHA; not deploying."
            { echo "deploy=false"; echo "sha=$CI_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Destructive-migration guard: migrations added by this commit (a squash merge is one commit).
          added="$(git diff --name-only --diff-filter=A "$CI_SHA^" "$CI_SHA" -- 'superadmin/apps/*/migrations/*.py' |
            grep -v '__init__\.py$' || true)"
          bad=0
          for f in $added; do
            if hits="$(git show "$CI_SHA:$f" | grep -nE '\b(RemoveField|DeleteModel|RenameField|RenameModel|AlterField|RunSQL)\b')"; then
              echo "::error file=$f::Destructive or risky migration operation (AlterField needs review): $(tr '\n' ' ' <<< "$hits")"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::Automatic deploy stopped: deploy manually with confirm=DEPLOY after review."
            exit 1
          fi
          { echo "deploy=true"; echo "sha=$CI_SHA"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.decide.outputs.deploy == 'true'
        with:
          ref: ${{ steps.decide.outputs.sha }}
      - name: Print the deployment plan
        if: steps.decide.outputs.deploy == 'true'
        run: |
          superadmin/deploy/azure/deploy.sh --dry-run | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push image to ghcr.io
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - id: image
        name: Image name
        # Package "vitalos-platform/superadmin", public so Container Apps pulls it without a token.
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vitalos-platform/superadmin:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: superadmin
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # No attestation manifests: they add package versions that count against storage.
          provenance: false
      - name: Keep only the 3 newest image versions (GitHub Packages free storage)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: vitalos-platform/superadmin
          package-type: container
          min-versions-to-keep: 3

  backup:
    name: Pre-migration database backup
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run the Super Admin backup workflow and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No dump is created or uploaded here: this repository is public, so personal data stays out
          # of this workflow's artifacts and logs. backup.yml (the 'backup' environment) owns the dump.
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run backup.yml --repo "$GITHUB_REPOSITORY" --ref main
          id=""
          for attempt in $(seq 1 30); do
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backup.yml --event workflow_dispatch \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$start\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::backup run did not start; no deploy without a fresh backup"; exit 1; }
          echo "Backup run $id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15 ||
            { echo "::error::backup run $id failed; deploy stopped before migrations"; exit 1; }

  deploy:
    name: Deploy to Azure Container Apps
    needs: [plan, build, backup]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://admin.vitalos.co.uk
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: prev
        name: Record the image running now (for the rollback command)
        run: |
          image="$(az containerapp show -n superadmin -g rg-vitalos-superadmin \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Currently running: ${image:-none (first deploy)}"
      - name: Deploy (secrets generated here, written only to Container Apps secrets)
        id: deploy
        env:
          AZ_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          IMAGE: ${{ needs.build.outputs.image }}
          DATABASE_URL: ${{ secrets.SUPERADMIN_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          # Mail and enquiries (superadmin/docs/email-setup.md). Each is passed through only when set;
          # an unset secret or variable arrives empty and is skipped, never written over a stored value.
          PRIMARY_OWNER_EMAIL: ${{ vars.PRIMARY_OWNER_EMAIL }}
          EMAIL_TRANSPORT: ${{ vars.EMAIL_TRANSPORT }}
          INBOUND_PROVIDER: ${{ vars.INBOUND_PROVIDER }}
          NOTIFY_OWNER_EMAIL: ${{ vars.NOTIFY_OWNER_EMAIL }}
          OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION }}
          RETENTION_ENFORCE: ${{ vars.RETENTION_ENFORCE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          INBOUND_WEBHOOK_SECRET: ${{ secrets.INBOUND_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Used only if the app has no such secret yet; existing values are always kept.
          NEW_DJANGO_SECRET_KEY="$(openssl rand -base64 64 | tr -d '\n')"
          NEW_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 30 | tr -d '\n/+=')"
          echo "::add-mask::$NEW_DJANGO_SECRET_KEY"
          echo "::add-mask::$NEW_BOOTSTRAP_ADMIN_PASSWORD"
          export NEW_DJANGO_SECRET_KEY NEW_BOOTSTRAP_ADMIN_PASSWORD
          superadmin/deploy/azure/deploy.sh
      - name: Post-deploy check (live health and served image)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://admin.vitalos.co.uk/healthz/ || true)"
            if [ "$code" = 200 ]; then ok=1; break; fi
            echo "healthz returned $code (attempt $attempt of 30)"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::https://admin.vitalos.co.uk/healthz/ did not return 200 within 5 minutes"; exit 1; }
          running="$(az containerapp show -n superadmin -g rg-vitalos-superadmin \
            --query 'properties.template.containers[0].image' -o tsv)"
          [ "$running" = "$IMAGE" ] || { echo "::error::app runs $running, expected $IMAGE"; exit 1; }
          echo "Healthy and serving $IMAGE"
      - name: Rollback command (run it yourself; nothing is rolled back automatically)
        if: failure()
        env:
          PREVIOUS: ${{ steps.prev.outputs.image }}
        run: |
          echo "::error::Deploy failed. If the app already took the new image, roll back the code with:"
          echo "::error::az containerapp update -n superadmin -g rg-vitalos-superadmin --image ${PREVIOUS:-<previous image>}"
          echo "::error::Migrations only move forward; restore the backup taken just before this deploy (DEPLOY.md section 6) only if the data is damaged."
      - uses: actions/setup-python@v7
        if: inputs.smoke_test && steps.deploy.outputs.bound == 'true'
        with:
          python-version: "3.12"
      - name: Live smoke test
        if: inputs.smoke_test && steps.deploy.outputs.bound == 'true'
        working-directory: superadmin
        env:
          SMOKE_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          password="$(az containerapp secret show -n superadmin -g rg-vitalos-superadmin \
            --secret-name bootstrap-admin-password --query value -o tsv)"
          echo "::add-mask::$password"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          SMOKE_BASE_URL=https://admin.vitalos.co.uk SMOKE_EMAIL="$SMOKE_EMAIL" SMOKE_PASSWORD="$password" \
            python e2e/smoke.py --skip-if-enrolled
