name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
# Results go to code scanning (Security tab; free for a public repository) and are also enforced
# below, so a finding fails the run (ADR-014). Pull requests from forks get a read-only token and
# cannot upload, so they keep the results in the run only.
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore
      - name: Fail on findings
        run: |
          findings=$(jq -r '.runs[].results[]? | select((.level // "warning") | IN("error", "warning"))
            | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
            codeql-results/*.sarif)
          if [ -n "$findings" ]; then
            echo "$findings"
            echo "::error::CodeQL reported findings; download the codeql-sarif artifact for details."
            exit 1
          fi
          echo "No CodeQL findings at error or warning level."
