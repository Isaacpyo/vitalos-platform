name: CodeQL
# JavaScript/TypeScript analysis, so only changes to those files (or this workflow) start it on pull
# requests and pushes. The weekly run re-analyses main with the latest queries so new alerts reach
# code scanning without a code change. Draft pull requests skip it until ready_for_review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
# Results go to code scanning (Security tab; free for a public repository) and are also enforced
# below, so a finding fails the run (ADR-014). Pull requests from forks get a read-only token and
# cannot upload, so they keep the results in the run only.
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail on findings
        run: |
          findings=$(jq -r '.runs[].results[]? | select((.level // "warning") | IN("error", "warning"))
            | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
            codeql-results/*.sarif)
          if [ -n "$findings" ]; then
            echo "$findings"
            echo "::error::CodeQL reported findings; download the codeql-sarif artifact for details."
            exit 1
          fi
          echo "No CodeQL findings at error or warning level."
