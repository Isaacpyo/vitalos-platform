name: CodeQL
# Weekly and on demand only, to keep Actions minutes down (ADR-014 amendment, 11 Oct 2026).
# Run it by hand before a release or after a security-sensitive change.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
# Code scanning uploads are unavailable for this user-owned private repository,
# so results stay in the run: published as an artifact and enforced below (ADR-014).
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore
      - name: Fail on findings
        run: |
          findings=$(jq -r '.runs[].results[]? | select((.level // "warning") | IN("error", "warning"))
            | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
            codeql-results/*.sarif)
          if [ -n "$findings" ]; then
            echo "$findings"
            echo "::error::CodeQL reported findings; download the codeql-sarif artifact for details."
            exit 1
          fi
          echo "No CodeQL findings at error or warning level."
