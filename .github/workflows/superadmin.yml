name: Super Admin
# Cost rules: AGENTS.md "CI cost". Super Admin docs alone do not start it; the content API contract
# does (the admin vendors it and a test checks the copy, ADR-040); the container job skips
# draft pull requests.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "superadmin/**"
      - "!superadmin/**.md"
      - "!superadmin/docs/**"
      - "contracts/content-api/**"
      - ".github/workflows/superadmin.yml"
      - ".github/workflows/superadmin-deploy.yml"
  push:
    branches: [main]
    paths:
      - "superadmin/**"
      - "!superadmin/**.md"
      - "!superadmin/docs/**"
      - "contracts/content-api/**"
      - ".github/workflows/superadmin.yml"
      - ".github/workflows/superadmin-deploy.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main push: every superadmin commit needs its own finished run for the auto-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: superadmin

jobs:
  test:
    name: Lint, tests and deploy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: superadmin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/superadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Email guard (only the mailer modules call a mail API; AGENTS.md, Email)
        run: node ../tooling/scripts/check-email-senders.mjs
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: pytest (PostgreSQL)
        run: pytest
      # AI & Data demonstrator release gate (AC-1 to AC-13, docs/ai-data/engineering/demonstrator-acceptance.md).
      # Offline: no database, no network, no key; the model path uses labelled simulated responses.
      - name: AI & Data evaluation gate (offline)
        run: python manage.py recon_eval --dataset v1 --config rules-only --config rules+simulated-model --out /tmp/eval
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      # AI & Data workspace prompts (ADR-055): offline reliability cases with hand-written model responses.
      # Reliability only: it says nothing about live model quality.
      - name: AI & Data workspace reliability cases (offline)
        run: python manage.py aidata_eval --out /tmp/aidata-eval
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: admin.vitalos.co.uk
          CSRF_TRUSTED_ORIGINS: https://admin.vitalos.co.uk
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DJANGO_SECRET_KEY
          python manage.py check --deploy --fail-level WARNING

  # Every email in light, dark and plain text, with 600px and 390px screenshots and one contact sheet
  # per category (docs/email/README.md). Fictional data only; nothing is sent. Skips draft pull requests.
  email-gallery:
    name: Email gallery
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: sqlite:////tmp/gallery.sqlite3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput && python manage.py seed_architecture
      - name: Website and Relay emails (TypeScript)
        run: pnpm --filter @vitalos/web email:gallery /tmp/ts-emails
        working-directory: .
      - run: python manage.py email_gallery --out ../docs/email/gallery --import /tmp/ts-emails
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: .
      - run: node scripts/email-gallery-shots.mjs docs/email/gallery
        working-directory: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: email-gallery
          path: docs/email/gallery
          retention-days: 7

  security:
    name: pip-audit and bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pip-audit (runtime dependencies)
        run: pip-audit --strict -r requirements.txt
      - name: bandit
        run: bandit -r apps config -c pyproject.toml

  container:
    name: Container build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    if: github.event.pull_request.draft != true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: superadmin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (layers cached in GitHub Actions; main writes the cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: superadmin
          load: true
          tags: vitalos-superadmin:ci
          cache-from: type=gha,scope=superadmin
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=superadmin,mode=max' || '' }}
      - name: Run release job and start the production image
        run: |
          umask 077
          {
            echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/superadmin"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "CSRF_TRUSTED_ORIGINS=http://localhost:8000"
            echo "SECURE_SSL_REDIRECT=False"
            echo "BOOTSTRAP_ADMIN_EMAIL=ci-admin@example.test"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
            echo "INBOUND_WEBHOOK_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          } > "$RUNNER_TEMP/app.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" vitalos-superadmin:ci bin/release.sh
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" vitalos-superadmin:ci bin/release.sh
          docker run -d --name web --network host --env-file "$RUNNER_TEMP/app.env" vitalos-superadmin:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8000/login/
      - name: Backup job writes a restorable dump
        run: |
          mkdir -p "$RUNNER_TEMP/backups" && chmod 777 "$RUNNER_TEMP/backups"
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" -v "$RUNNER_TEMP/backups:/backups" \
            vitalos-superadmin:ci bin/backup.sh
          ls -l "$RUNNER_TEMP/backups"
      - name: Install Playwright
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          export SMOKE_BASE_URL=http://localhost:8000
          export SMOKE_EMAIL=ci-admin@example.test
          SMOKE_PASSWORD="$(grep '^BOOTSTRAP_ADMIN_PASSWORD=' "$RUNNER_TEMP/app.env" | cut -d= -f2-)"
          export SMOKE_PASSWORD
          python e2e/smoke.py --screenshots "$RUNNER_TEMP/screenshots"
      - name: Accessibility (axe-core, WCAG 2.2 AA, light and dark)
        run: |
          # axe-core from the npm registry (npm verifies the package integrity), pinned to one version.
          npm pack --silent axe-core@4.13.0 --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -xzf "$RUNNER_TEMP/axe-core-4.13.0.tgz" -C "$RUNNER_TEMP"
          # A signed-in, second-factor-verified session for the CI admin, minted inside the container.
          SESSION="$(docker exec web python manage.py shell -c "
          from django.contrib.auth import get_user_model
          from django.contrib.sessions.backends.db import SessionStore
          from django_otp import DEVICE_ID_SESSION_KEY
          from django_otp.plugins.otp_totp.models import TOTPDevice
          user = get_user_model().objects.get(email='ci-admin@example.test')
          device, _ = TOTPDevice.objects.get_or_create(user=user, name='ci-a11y', defaults={'confirmed': True})
          session = SessionStore()
          session.update({'_auth_user_id': str(user.pk), '_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',
                          '_auth_user_hash': user.get_session_auth_hash(), DEVICE_ID_SESSION_KEY: device.persistent_id})
          session.create()
          print(session.session_key)" | tail -n 1)"
          echo "::add-mask::$SESSION"
          INBOUND_SECRET="$(grep '^INBOUND_WEBHOOK_SECRET=' "$RUNNER_TEMP/app.env" | cut -d= -f2-)"
          echo "::add-mask::$INBOUND_SECRET"
          python e2e/a11y.py --base http://localhost:8000 --axe "$RUNNER_TEMP/package/axe.min.js"             --session "$SESSION" --inbound-secret="$INBOUND_SECRET"
      - name: Container logs
        if: always()
        run: docker logs web 2>&1 | tail -200 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: superadmin-smoke-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
