name: Super Admin
on:
  pull_request:
    paths:
      - "superadmin/**"
      - ".github/workflows/superadmin.yml"
  push:
    branches: [main]
    paths:
      - "superadmin/**"
      - ".github/workflows/superadmin.yml"
permissions:
  contents: read
concurrency:
  group: superadmin-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: superadmin

jobs:
  test:
    name: Lint, tests and deploy checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: superadmin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/superadmin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: pytest (PostgreSQL)
        run: pytest
      - name: manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: admin.vitalos.co.uk
          CSRF_TRUSTED_ORIGINS: https://admin.vitalos.co.uk
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

  security:
    name: pip-audit and bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pip-audit (runtime dependencies)
        run: pip-audit --strict -r requirements.txt
      - name: bandit
        run: bandit -r apps config -c pyproject.toml

  container:
    name: Container build and browser smoke test
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: superadmin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - name: Build image
        run: docker build -t vitalos-superadmin:ci .
      - name: Run release job and start the production image
        run: |
          umask 077
          {
            echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/superadmin"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "CSRF_TRUSTED_ORIGINS=http://localhost:8000"
            echo "SECURE_SSL_REDIRECT=False"
            echo "BOOTSTRAP_ADMIN_EMAIL=ci-admin@example.test"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          } > "$RUNNER_TEMP/app.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" vitalos-superadmin:ci bin/release.sh
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" vitalos-superadmin:ci bin/release.sh
          docker run -d --name web --network host --env-file "$RUNNER_TEMP/app.env" vitalos-superadmin:ci
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8000/login/
      - name: Backup job writes a restorable dump
        run: |
          mkdir -p "$RUNNER_TEMP/backups" && chmod 777 "$RUNNER_TEMP/backups"
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" -v "$RUNNER_TEMP/backups:/backups" \
            vitalos-superadmin:ci bin/backup.sh
          ls -l "$RUNNER_TEMP/backups"
      - name: Install Playwright
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          export SMOKE_BASE_URL=http://localhost:8000
          export SMOKE_EMAIL=ci-admin@example.test
          export SMOKE_PASSWORD="$(grep '^BOOTSTRAP_ADMIN_PASSWORD=' "$RUNNER_TEMP/app.env" | cut -d= -f2-)"
          python e2e/smoke.py --screenshots "$RUNNER_TEMP/screenshots"
      - name: Container logs
        if: always()
        run: docker logs web 2>&1 | tail -200 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-smoke-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14
