name: Super Admin backup
# Daily logical backup of the Super Admin's database (Supabase by default, or Neon) at 02:00 UTC. The dump is
# encrypted with BACKUP_PASSPHRASE and written to a private Azure Blob Storage container (DECISIONS #101). It is
# never uploaded as a workflow artifact: the repository is public, so artifacts are downloadable by anyone signed in.
# The container has a 14-day time-based immutability policy (a blob can't be deleted or overwritten for 14 days,
# even by this workflow) and a lifecycle rule that deletes blobs after 15 days.
# The "backup" environment (no required reviewers, so the schedule is never held) holds:
#   secrets DATABASE_URL (the read-only backup_reader role, DEPLOY.md §6.1) and BACKUP_PASSPHRASE;
#   secrets AZURE_BACKUP_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID for OIDC (no stored Azure keys); the app
#   registration github-vitalos-superadmin-backup only has Storage Blob Data Contributor on the container;
#   variables BACKUP_STORAGE_ACCOUNT and BACKUP_CONTAINER.
# On Supabase's free plan this is the only backup, and the daily connection also keeps the project from pausing.
# Scheduled runs only start once this file is on main. Restore steps: superadmin/docs/DEPLOY.md §6.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superadmin-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC to Azure; no stored Azure keys
    steps:
      - name: pg_dump (client matching the server's PostgreSQL version)
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set in the 'backup' environment (see DEPLOY.md)"
            exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set in the 'backup' environment; an unencrypted dump is never stored."
            exit 1
          fi
          # pg_dump needs a session. Supabase's session pooler (port 5432) provides one, so its URL is
          # used as is. Neon's pooler is PgBouncer in transaction mode, so switch to its direct host.
          direct="${DATABASE_URL/-pooler./.}"
          echo "::add-mask::$direct"
          # Dump with the client of the server's major version (Supabase 15 or 17, Neon 17), so the dump
          # restores cleanly on that version; a newer client writes settings an older server rejects.
          server="$(docker run --rm -e PGURL="$direct" postgres:17 sh -c 'psql "$PGURL" -tAc "show server_version_num"')"
          major="$((server / 10000))"
          case "$major" in 1[4-9]) echo "Server is PostgreSQL $major" ;; *) echo "::error::unexpected server version $server"; exit 1 ;; esac
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p dump
          file="dump/superadmin-$stamp-pg$major.sql.gz"
          # Only the app's schema: Supabase's own schemas (auth, storage, ...) are platform-managed and
          # not readable by backup_reader. The app keeps everything in public.
          docker run --rm -e PGURL="$direct" "postgres:$major" \
            sh -c 'pg_dump --schema=public --no-owner --no-privileges --dbname="$PGURL"' | gzip -9 > "$file"
          gzip -t "$file"
          header="$(zcat "$file" | head -n 20 || true)"  # head closes the pipe early; ignore SIGPIPE
          grep -q "PostgreSQL database dump" <<< "$header" || { echo "::error::dump looks empty"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "$file.gpg" "$file" <<< "$BACKUP_PASSPHRASE"
          rm "$file"
          ls -l dump
          echo "file=$file.gpg" >> "$GITHUB_OUTPUT"
          echo "blob=superadmin/$(date -u +%Y/%m)/superadmin-$stamp-pg$major.sql.gz.gpg" >> "$GITHUB_OUTPUT"
      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_BACKUP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true # the identity only has a role on one storage container
      - name: Store the encrypted dump in private blob storage
        env:
          ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.BACKUP_CONTAINER }}
          FILE: ${{ steps.dump.outputs.file }}
          BLOB: ${{ steps.dump.outputs.blob }}
        run: |
          set -euo pipefail
          if [ -z "$ACCOUNT" ] || [ -z "$CONTAINER" ]; then
            echo "::error::BACKUP_STORAGE_ACCOUNT and BACKUP_CONTAINER must be set as 'backup' environment variables"
            exit 1
          fi
          case "$FILE" in *.gpg) ;; *) echo "::error::refusing to store an unencrypted file"; exit 1 ;; esac
          az storage blob upload --auth-mode login --account-name "$ACCOUNT" --container-name "$CONTAINER"             --file "$FILE" --name "$BLOB" --overwrite false --only-show-errors --output none
          local_size="$(stat -c %s "$FILE")"
          remote_size="$(az storage blob show --auth-mode login --account-name "$ACCOUNT" --container-name "$CONTAINER"             --name "$BLOB" --query properties.contentLength --output tsv --only-show-errors)"
          if [ "$local_size" != "$remote_size" ]; then
            echo "::error::stored blob is $remote_size bytes, expected $local_size"
            exit 1
          fi
          echo "Stored $BLOB ($remote_size bytes)"
          rm -f "$FILE"
