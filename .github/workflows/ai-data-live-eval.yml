name: AI & Data live evaluation
# AC-14: the reconciliation demonstrator's model path against the real provider configured for
# AI & Data (docs/ai-data/engineering/demonstrator.md, "Live run"). Manual only, from main, in the
# production environment (deployment branches restricted to main), with a hard cap of 40 provider
# calls. Key: AI & Data's own secret AI_DATA_LLM_API_KEY when set, otherwise the organisation's
# ANTHROPIC_API_KEY (owner instruction, 28 Oct 2026; AID-017). Provider: AI_DATA_LLM_PROVIDER, default
# anthropic (model AI_DATA_LLM_MODEL, default claude-sonnet-5-5). The report contains synthetic data only
# (dataset v1), is printed to the job log and summary, and is uploaded as an artifact kept for 7 days.
# It never runs on pull requests.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type LIVE to call the model provider (costs real money, capped at 40 calls)
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: superadmin

jobs:
  live-eval:
    name: Live provider evaluation (AC-14)
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'LIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # Development settings read AI_DATA_LLM_* from the environment (test settings blank them). The
      # evaluation never touches the database; the SQLite path only satisfies settings loading.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: sqlite:////tmp/live-eval.sqlite3
      AI_DATA_LIVE_EVAL: "1"
      AI_DATA_LLM_PROVIDER: ${{ vars.AI_DATA_LLM_PROVIDER || 'anthropic' }}
      AI_DATA_LLM_BASE_URL: ${{ vars.AI_DATA_LLM_BASE_URL }}
      AI_DATA_LLM_MODEL: ${{ vars.AI_DATA_LLM_MODEL }}
      AI_DATA_LLM_EFFORT: ${{ vars.AI_DATA_LLM_EFFORT || 'low' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Check configuration (fails clearly when no key is available)
        env:
          AI_DATA_LLM_API_KEY: ${{ secrets.AI_DATA_LLM_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$AI_DATA_LLM_API_KEY" ]; then
            echo "::error::Neither AI_DATA_LLM_API_KEY nor the organisation's ANTHROPIC_API_KEY is available to this repository's production environment."
            exit 1
          fi
          if [ "$AI_DATA_LLM_PROVIDER" = "openai-compatible" ] && { [ -z "$AI_DATA_LLM_BASE_URL" ] || [ -z "$AI_DATA_LLM_MODEL" ]; }; then
            echo "::error::openai-compatible needs AI_DATA_LLM_BASE_URL and AI_DATA_LLM_MODEL."
            exit 1
          fi
          echo "Provider $AI_DATA_LLM_PROVIDER, model ${AI_DATA_LLM_MODEL:-default}, effort $AI_DATA_LLM_EFFORT."
      - name: Live evaluation (hard cap 40 calls)
        env:
          AI_DATA_LLM_API_KEY: ${{ secrets.AI_DATA_LLM_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: >-
          python manage.py recon_eval --dataset v1 --config rules-only --config rules+live-model
          --compare rules-only,rules+live-model --max-calls 40 --out "$RUNNER_TEMP/live-eval"
      - name: Print the report (synthetic data only)
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/live-eval/*.md; do
            [ -f "$f" ] || continue
            cat "$f"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload report (synthetic data only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-data-live-eval
          path: ${{ runner.temp }}/live-eval
          if-no-files-found: ignore
          retention-days: 7
