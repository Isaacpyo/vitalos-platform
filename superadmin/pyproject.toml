[project]
name = "vitalos-superadmin"
version = "0.1.0"
description = "Vitalos Super Admin: internal owner of the Vitalos company architecture."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:pkg_resources"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["DJ001", "E501"]  # ruff format owns line length; long literals are allowed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"e2e/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", "e2e", ".venv"]
