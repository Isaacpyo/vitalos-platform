{% load portal_ui %}{# Mobile app shell (ADR-056, Phase 1): shown at the mobile breakpoint and always in the installed app. #}
    <nav class="tabbar" aria-label="Primary" data-testid="tabbar">
      <a class="tabbar__item" href="{% purl 'home' %}"{% if nav == 'home' %} aria-current="page"{% endif %}>
        <span class="tabbar__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.75 10.75 12 4l8.25 6.75"/><path d="M6 9.25v10.5h4.25V14.5h3.5v5.25H18V9.25"/></svg>
        </span>
        <span class="tabbar__label">Home</span>
      </a>
      <a class="tabbar__item" href="{% purl 'challenges' %}"{% if nav == 'challenges' %} aria-current="page"{% endif %}>
        <span class="tabbar__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.5 20.5V3.75"/><path d="M5.5 4.5h12l-2.5 4.25 2.5 4.25h-12"/></svg>
        </span>
        <span class="tabbar__label">Challenges</span>
      </a>
      <a class="tabbar__item" href="{% purl 'questions' %}"{% if nav == 'questions' %} aria-current="page"{% endif %}>
        <span class="tabbar__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.25 5.75a1.5 1.5 0 0 1 1.5-1.5h12.5a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.25 3.5v-3.5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M10 8.6a2 2 0 1 1 2.75 1.85c-.5.2-.75.6-.75 1.1v.45"/><path d="M12 14.1v.01"/></svg>
        </span>
        <span class="tabbar__label">Questions</span>
      </a>
      <a class="tabbar__item" href="{% purl 'notifications' %}"{% if nav == 'notifications' %} aria-current="page"{% endif %} data-testid="tab-notifications">
        <span class="tabbar__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.25 16.25V11a5.75 5.75 0 0 1 11.5 0v5.25l1.5 2H4.75z"/><path d="M10 20.5a2.25 2.25 0 0 0 4 0"/></svg>
          {% if unread %}<span class="tabbar__badge" aria-hidden="true" data-testid="tab-unread">{% if unread > 99 %}99+{% else %}{{ unread }}{% endif %}</span>{% endif %}
        </span>
        <span class="tabbar__label">Notifications{% if unread %}<span class="sr-only">, {{ unread }} unread</span>{% endif %}</span>
      </a>
      <button type="button" class="tabbar__item{% if nav == 'files' or nav == 'account' or nav == 'search' %} is-active{% endif %}" popovertarget="portal-nav" aria-controls="portal-nav">
        <span class="tabbar__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" stroke="none" aria-hidden="true" focusable="false"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        </span>
        <span class="tabbar__label">More</span>
      </button>
    </nav>
