{% extends "accounts/auth_base.html" %}
{% block title %}Sign in · Vitalos Super Admin{% endblock %}
{% block auth_body %}
  <h1 class="mb-6 text-xl font-semibold">Sign in</h1>
  <form method="post" action="{% url 'accounts:login' %}" novalidate>
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary mt-6 w-full">Sign in</button>
  </form>
{% endblock %}
