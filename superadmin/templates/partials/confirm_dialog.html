{# One confirmation dialog for the whole admin (static/js/app.js, "Confirmations"): Send email, data-confirm forms and hx-confirm buttons. Text is set with textContent, never as HTML. Clicking outside the box, Escape or Cancel all mean no. #}
<dialog id="confirm-dialog" class="confirm-dialog card w-[min(28rem,calc(100vw-2rem))] p-0 text-slate-900 dark:text-slate-100" aria-labelledby="confirm-title" aria-describedby="confirm-body" data-testid="confirm-dialog">
  <div class="p-6">
    <h2 id="confirm-title" class="text-lg font-semibold" data-confirm-title></h2>
    <p id="confirm-body" class="muted mt-2 text-sm" data-confirm-body hidden></p>
    <dl class="mt-4 grid grid-cols-[auto_minmax(0,1fr)] gap-x-4 gap-y-1.5 rounded-md bg-slate-50 p-3 text-sm dark:bg-slate-800/60" data-confirm-details hidden></dl>
    <p class="mt-3 rounded-md bg-amber-50 p-2.5 text-xs text-amber-900 dark:bg-amber-400/10 dark:text-amber-100" data-confirm-note hidden></p>
    <div class="mt-5 flex justify-end gap-2">
      <button type="button" class="btn btn-ghost" data-confirm-cancel>Cancel</button>
      <button type="button" class="btn btn-primary" data-confirm-ok data-testid="confirm-ok">Confirm</button>
    </div>
  </div>
</dialog>
