<div>
  {% if field.widget_type == "checkbox" %}
    <label class="flex items-center gap-2 text-sm font-medium">{{ field }} <span>{{ field.label }}</span></label>
  {% elif field.widget_type == "checkboxselectmultiple" %}
    <fieldset>
      <legend class="mb-1 block text-[13px] font-medium">{{ field.label }}</legend>
      <div class="flex flex-wrap gap-x-4 gap-y-2">
        {% for choice in field %}<label class="flex items-center gap-2 text-sm">{{ choice.tag }} {{ choice.choice_label }}</label>{% endfor %}
      </div>
    </fieldset>
  {% else %}
    <label for="{{ field.id_for_label }}" class="mb-1 block text-[13px] font-medium">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if help %}<p class="relay-muted mt-1 text-xs">{{ help }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-xs font-medium text-rose-700 dark:text-rose-300">{{ error }}</p>{% endfor %}
</div>
