{% extends "base.html" %}
{% block title %}Relay · Vitalos Super Admin{% endblock %}
{% block content %}
  <div class="relay-panel mx-auto mt-10 max-w-lg p-8">
    <p class="relay-mono relay-muted">Relay</p>
    <h1 class="mt-2 font-display text-xl font-bold">Relay could not show this page<span class="text-cobalt-600 dark:text-cobalt-300">.</span></h1>
    <p class="relay-muted mt-2 text-sm">{{ message }}</p>
    <a href="{% url 'relay:inbox' %}" class="relay-btn relay-btn-primary mt-6">Back to the inbox</a>
  </div>
{% endblock %}
