<span id="relay-bell-count" hx-get="{% url 'relay:bell' %}" hx-trigger="relay-badge-refresh from:body, every 30s" hx-swap="outerHTML">{% if relay_unread %}<span aria-hidden="true" class="absolute -right-1.5 -top-1.5 flex h-5 min-w-5 items-center justify-center rounded-full border-2 border-white bg-cobalt-600 px-1 text-[11px] font-semibold text-white dark:border-slate-900" data-testid="relay-bell-count">{% if relay_unread > 99 %}99+{% else %}{{ relay_unread }}{% endif %}</span><span class="sr-only">, {{ relay_unread }} unread</span>{% endif %}</span>
