{% spaceless %}
{% if state == "COMPLETED" %}<span class="inline-flex items-center rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-700 ring-1 ring-emerald-200 ring-inset dark:bg-emerald-950 dark:text-emerald-300 dark:ring-emerald-800" data-state="{{ state }}">Completed</span>
{% elif state == "REVIEW_REQUIRED" %}<span class="inline-flex items-center rounded-full bg-amber-50 px-2 py-0.5 text-xs font-semibold text-amber-800 ring-1 ring-amber-200 ring-inset dark:bg-amber-950 dark:text-amber-300 dark:ring-amber-800" data-state="{{ state }}">Review required</span>
{% elif state == "FAILED" %}<span class="inline-flex items-center rounded-full bg-rose-50 px-2 py-0.5 text-xs font-semibold text-rose-700 ring-1 ring-rose-200 ring-inset dark:bg-rose-950 dark:text-rose-300 dark:ring-rose-800" data-state="{{ state }}">Failed</span>
{% elif state == "UNSUPPORTED" %}<span class="inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-700 ring-1 ring-slate-300 ring-inset dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-600" data-state="{{ state }}">Unsupported</span>
{% elif state == "NOTE" %}<span class="inline-flex items-center rounded-full bg-sky-50 px-2 py-0.5 text-xs font-semibold text-sky-700 ring-1 ring-sky-200 ring-inset dark:bg-sky-950 dark:text-sky-300 dark:ring-sky-800" data-state="{{ state }}">Note</span>
{% else %}<span class="inline-flex items-center rounded-full bg-blue-50 px-2 py-0.5 text-xs font-semibold text-blue-700 ring-1 ring-blue-200 ring-inset dark:bg-blue-950 dark:text-cobalt-300 dark:ring-blue-800" data-state="{{ state }}">{{ state|title }}</span>{% endif %}
{% endspaceless %}
